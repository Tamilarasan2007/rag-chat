[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tamilarasan2007", email = "ramalingatamilarasan@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.1",
    "fastapi>=0.151.0",
    "langchain>=1.4.6",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.12",
    "langchain-groq>=1.1.3",
    "pymupdf>=2.0",
    "pypdf>=6.21.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "sentence-transformers>=6.1.0",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
